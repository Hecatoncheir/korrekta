name: Проверка инструмента сравнения моделей
on:
  push:
    branches: [main]
    paths: ['tools/model_benchmark/**', 'benchmarks/sage/**', 'benchmarks/languagetool/**', 'benchmarks/preservation/**', 'benchmarks/cases-v1.*', 'benchmarks/prepare_cases.py', '.github/workflows/benchmark-tool.yml']
  pull_request:
    paths: ['tools/model_benchmark/**', 'benchmarks/sage/**', 'benchmarks/languagetool/**', 'benchmarks/preservation/**', 'benchmarks/cases-v1.*', 'benchmarks/prepare_cases.py', '.github/workflows/benchmark-tool.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/model_benchmark
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - run: dart pub get --enforce-lockfile
      - name: Проверить синтаксис исследовательских запусков
        run: python3 -m py_compile ../../benchmarks/sage/run.py ../../benchmarks/languagetool/prepare.py ../../benchmarks/languagetool/pipeline.py ../../benchmarks/preservation/prepare_cases.py ../../benchmarks/preservation/check_retention.py
      - name: Проверить воспроизводимость набора
        run: |
          python3 ../../benchmarks/prepare_cases.py
          python3 ../../benchmarks/preservation/prepare_cases.py
          git diff --exit-code -- ../../benchmarks/cases-v1.jsonl ../../benchmarks/preservation/cases-v1.jsonl
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
