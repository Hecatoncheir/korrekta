name: Проверка инструмента сравнения моделей
on:
  push:
    branches: [main]
    paths: ['tools/model_benchmark/**', 'benchmarks/text-guard/**', 'benchmarks/prompt-precision/**', 'benchmarks/lt-confirmation/**', 'benchmarks/dictionaries/**', 'benchmarks/hunspell-ranker/**', 'benchmarks/ensemble/**', 'benchmarks/ensemble-tuning/**', 'benchmarks/sage/**', 'benchmarks/sage-v1.1/**', 'benchmarks/giga20-gfusion/**', 'benchmarks/languagetool/**', 'benchmarks/preservation/**', 'benchmarks/sber-large/**', 'benchmarks/gigachat-prompts/**', 'benchmarks/cases-v1.*', 'benchmarks/prepare_cases.py', '.github/workflows/benchmark-tool.yml']
  pull_request:
    paths: ['tools/model_benchmark/**', 'benchmarks/text-guard/**', 'benchmarks/prompt-precision/**', 'benchmarks/lt-confirmation/**', 'benchmarks/dictionaries/**', 'benchmarks/hunspell-ranker/**', 'benchmarks/ensemble/**', 'benchmarks/ensemble-tuning/**', 'benchmarks/sage/**', 'benchmarks/sage-v1.1/**', 'benchmarks/giga20-gfusion/**', 'benchmarks/languagetool/**', 'benchmarks/preservation/**', 'benchmarks/sber-large/**', 'benchmarks/gigachat-prompts/**', 'benchmarks/cases-v1.*', 'benchmarks/prepare_cases.py', '.github/workflows/benchmark-tool.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/model_benchmark
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - run: dart pub get --enforce-lockfile
      - name: Проверить синтаксис исследовательских запусков
        run: python3 -m py_compile ../../benchmarks/sage/run.py ../../benchmarks/sage-v1.1/download.py ../../benchmarks/sage-v1.1/audit_tokenizer.py ../../benchmarks/sage-v1.1/summarize.py ../../benchmarks/languagetool/prepare.py ../../benchmarks/languagetool/pipeline.py ../../benchmarks/preservation/prepare_cases.py ../../benchmarks/preservation/check_retention.py ../../benchmarks/sber-large/render_gigachat.py ../../benchmarks/sber-large/download_mt5.py ../../benchmarks/sber-large/summarize.py ../../benchmarks/gigachat-prompts/prepare_holdout.py ../../benchmarks/gigachat-prompts/select_candidate.py
      - name: Проверить синтаксис запуска GigaChat 20B и GFusion
        run: python3 -m compileall -q ../../benchmarks/giga20-gfusion
      - name: Проверить зафиксированную защиту текста и новый набор
        run: python3 ../../benchmarks/text-guard/summarize.py --check
      - name: Проверить исследование точности запроса
        run: python3 ../../benchmarks/prompt-precision/verify.py
      - name: Проверить подтверждение правок через LT
        run: python3 ../../benchmarks/lt-confirmation/run.py --check
      - name: Проверить словарное сравнение
        run: python3 ../../benchmarks/dictionaries/run.py --check
      - name: Проверить закрытый выбор Hunspell и GigaChat
        run: |
          python3 ../../benchmarks/hunspell-ranker/run.py --phase check
          python3 ../../benchmarks/hunspell-ranker/audit.py
      - name: Проверить общий локальный режим
        run: |
          python3 -m compileall -q ../../benchmarks/ensemble
          python3 ../../benchmarks/ensemble/evaluate.py --check
      - name: Проверить выбор по ролям источников
        run: |
          python3 -m compileall -q ../../benchmarks/ensemble-tuning
          python3 ../../benchmarks/ensemble-tuning/freeze.py --check
          python3 ../../benchmarks/ensemble-tuning/evaluate.py --phase dev --check
          python3 ../../benchmarks/ensemble-tuning/ablate.py --check
          python3 ../../benchmarks/ensemble-tuning/evaluate.py --phase fresh --check
          python3 ../../benchmarks/ensemble-tuning/audit.py
          python3 ../../benchmarks/ensemble-tuning/prepare_fresh.py
          git diff --exit-code -- ../../benchmarks/ensemble-tuning/fresh-v1.jsonl
      - name: Проверить воспроизводимость набора
        run: |
          python3 ../../benchmarks/prepare_cases.py
          python3 ../../benchmarks/dictionaries/prepare_layout.py
          python3 ../../benchmarks/prompt-precision/prepare.py
          python3 ../../benchmarks/preservation/prepare_cases.py
          python3 ../../benchmarks/gigachat-prompts/prepare_holdout.py
          git diff --exit-code -- ../../benchmarks/dictionaries/layout-holdout-v1.jsonl ../../benchmarks/prompt-precision/dev-v1.jsonl ../../benchmarks/prompt-precision/holdout-v1.jsonl ../../benchmarks/cases-v1.jsonl ../../benchmarks/preservation/cases-v1.jsonl ../../benchmarks/gigachat-prompts/holdout-v1.jsonl
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
