name: korrekta
description: Локальная проверка русского текста.
publish_to: 'none'
version: 0.1.8+9

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  korrekta_model_benchmark:
    path: ../tools/model_benchmark
  path: ^1.9.1
  path_provider: ^2.1.5
  file_selector: 1.0.4
  url_launcher: ^6.3.2
  flutter_bloc: ^9.1.1
  file_selector_linux: 0.9.3+2
  window_manager: 0.5.1
  screen_retriever: 0.2.0
  screen_retriever_linux: 0.2.0
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.1
  crypto: ^3.0.8
  http: ^1.6.0
  characters: ^1.4.1
  archive: ^4.6.0
  tar: ^2.0.3
  zstd_neo: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mark.png
    - assets/proposal.txt
    - assets/components.json
    - assets/update-macos.sh
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/font-5.ttf
          weight: 800
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/font-7.ttf
        - asset: assets/fonts/font-10.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/font-0.ttf
